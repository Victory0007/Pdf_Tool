spring.application.name=PDF_Tool

# Local service endpoints and model names can be overridden per environment.
pdf-tool.chroma.base-url=${CHROMA_URL:http://localhost:8000}
pdf-tool.ollama.base-url=${OLLAMA_URL:http://localhost:11434}
pdf-tool.ollama.chat-model=${OLLAMA_CHAT_MODEL:llama3.1}
pdf-tool.ollama.embedding-model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
pdf-tool.ollama.timeout=${OLLAMA_TIMEOUT:PT5M}

# Leave blank to use Tesseract's default tessdata discovery.
pdf-tool.ocr.tessdata-path=${TESSDATA_PATH:}
